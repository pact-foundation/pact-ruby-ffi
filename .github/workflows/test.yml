name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test_ffi:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        ruby-version: ['3.3', '3.4', '4.0']
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af  # v1.313.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - run: gem update bundler
      - run: make install
      - run: make download_libs
      - run: make test

  test_ffi_alpine:
    name: test_ffi_alpine (${{ matrix.ruby-version }}, ${{ matrix.runner }})
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    strategy:
      matrix:
        ruby-version: ['3.3', '3.4', '4.0']
        runner: [ubuntu-latest, ubuntu-24.04-arm]
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - run: make download_libs
      - run: |
          docker run --rm -v $PWD:/app ruby:${{ matrix.ruby-version }}-alpine \
            /bin/sh -c \
            'apk add --no-cache make gcc musl-dev libffi libffi-dev git bash curl && \
            cd /app && make download_all_libs && git config --global --add safe.directory /app && make install && make test'

  test_ffi_alpine_pr:
    name: test_ffi_alpine (${{ matrix.ruby-version }}, ubuntu-latest)
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    strategy:
      matrix:
        ruby-version: ['3.3', '3.4', '4.0']
      fail-fast: false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - run: make download_libs
      - run: |
          docker run --rm -v $PWD:/app ruby:${{ matrix.ruby-version }}-alpine \
            /bin/sh -c \
            'apk add --no-cache make gcc musl-dev libffi libffi-dev git bash curl && \
            cd /app && make download_all_libs && git config --global --add safe.directory /app && make install && make test'

  grpc_demo_protobuf_plugin:
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        ruby-version: ['3.3', '3.4', '4.0']
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af  # v1.313.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - run: gem update bundler
      - run: make install
      - run: make download_libs
      - run: make grpc

  test_compat_suite:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        ruby-version: ['3.3', '3.4', '4.0']
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af  # v1.313.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - run: make install
      - run: make download_libs
      - run: make compat_suite_test_v4
